    <!-- Settings Modal -->
    <div id="settings-overlay" style="display:none;" class="fixed inset-0 bg-black/40 z-50 items-center justify-center p-3">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden" style="max-height:92dvh;">
            <div class="bg-green-500 text-white px-4 py-3 font-bold flex justify-between items-center">
                <span>⚙️ 図形の大きさ</span>
                <button onclick="closeSettings()" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 leading-none">✕</button>
            </div>
            <div id="settings-tabs" class="flex flex-wrap gap-1 px-3 py-2 border-b border-green-100"></div>
            <div class="flex-1 overflow-y-auto px-4 py-3">
                <div id="settings-preview" class="flex flex-col items-center gap-1 mb-3"></div>
                <div id="settings-fields" class="flex flex-col gap-2"></div>
            </div>
            <div class="p-3 border-t border-gray-200 flex gap-2">
                <button onclick="resetShapeParams()" class="flex-1 px-3 py-2 rounded-xl font-bold text-sm bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-700">
                    初期値にもどす
                </button>
                <button onclick="addFromSettings()" class="flex-1 px-3 py-2 rounded-xl font-bold text-sm bg-green-500 hover:bg-green-600 text-white border border-green-600">
                    この形を追加
                </button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="share-overlay" style="display:none;" class="fixed inset-0 bg-black/40 z-50 items-center justify-center p-3">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden" style="max-height:92dvh;">
            <div class="bg-slate-600 text-white px-4 py-3 font-bold flex justify-between items-center">
                <span>🔗 この設定のリンク</span>
                <button onclick="closeShare()" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 leading-none">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto px-4 py-3 flex flex-col items-center gap-3">
                <p class="text-xs text-gray-600 text-center leading-relaxed">
                    このリンクを開くと、いま画面にある図形・補助線と大きさの設定がそのまま再現されます。<br>板書やプリントにQRコードを載せておけます。
                </p>
                <button id="share-include" onclick="toggleShareInclude()" class="w-full px-3 py-2 rounded-xl font-bold text-sm border bg-gray-100 text-gray-600 border-gray-300"></button>
                <div id="share-qr" class="w-44 h-44 bg-white p-2 rounded-xl border border-gray-200"></div>
                <p id="share-url" class="text-xs text-gray-500 break-all text-center leading-relaxed"></p>
                <p id="share-note" class="text-xs text-red-600 text-center leading-relaxed" style="display:none;"></p>
            </div>
            <div class="p-3 border-t border-gray-200 flex gap-2">
                <button onclick="copyShareUrl()" class="flex-1 px-3 py-2 rounded-xl font-bold text-sm bg-slate-600 hover:bg-slate-700 text-white border border-slate-700">
                    リンクをコピー
                </button>
                <button onclick="closeShare()" class="flex-1 px-3 py-2 rounded-xl font-bold text-sm bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-700">
                    とじる
                </button>
            </div>
        </div>
    </div>

    <script>
        const SVG_NS = "http://www.w3.org/2000/svg";
        const GRID_SIZE = 40;
        const SNAP_DIST = 24;   // 頂点どうしがくっつく距離
        const CUT_EPS = 0.8;    // これより近ければ「同じ場所」とみなす（px）
        const MIN_PIECE_AREA = GRID_SIZE * GRID_SIZE * 0.02; // これより小さい切れはしは作らない

        let shapes = [];
        let placedShapes = []; // 「置いたとき」の図形（リセット用）
        let guides = [];       // 補助線
        let historyStack = []; // もどる用
        let redoStack = [];    // すすむ用
        let shapeIdCounter = 0;
        let guideIdCounter = 0;
        let currentTool = 'move'; // move, cut, rotate, flip, color, guide, erase

        // Colors palette for clicking
        const colors = [
            {fill: '#fca5a5', stroke: '#ef4444'}, // red
            {fill: '#93c5fd', stroke: '#3b82f6'}, // blue
            {fill: '#fde047', stroke: '#eab308'}, // yellow
            {fill: '#86efac', stroke: '#22c55e'}, // green
            {fill: '#d8b4fe', stroke: '#a855f7'}, // purple
            {fill: '#fdba74', stroke: '#f97316'}  // orange
        ];

        // Canvas Elements
        const svg = document.getElementById('workspace');
        const viewGroup = document.getElementById('view');
        const gridRect = document.getElementById('grid-rect');
        const shapesLayer = document.getElementById('shapes-layer');
        const guidesLayer = document.getElementById('guides-layer');
        const cutLayer = document.getElementById('cut-layer');
        const cutLine = document.getElementById('cut-line');
        const guidePreview = document.getElementById('guide-preview');
        const flipAxis = document.getElementById('flip-axis');
        const snapMarker = document.getElementById('snap-marker');
        const toast = document.getElementById('instruction-toast');

        // ===== マスの大きさ（拡大・縮小）=====
        // 図形の座標（1マス＝40）はそのままにして、見え方だけを変えます。
        // こうするとスナップも切る計算もリンクの中身も今までどおりです。
        const ZOOM_STEPS = [0.4, 0.5, 0.65, 0.8, 1, 1.25, 1.6, 2, 2.5];
        let zoom = 1;   // 画面上での倍率
        let panX = 0;   // 画面の位置 ＝ pan ＋ zoom × 図形の位置
        let panY = 0;

        // 画面の真ん中に見えている場所（図形の座標で）
        function viewCenterWorld() {
            const r = svg.getBoundingClientRect();
            return {x: (r.width / 2 - panX) / zoom, y: (r.height / 2 - panY) / zoom};
        }

        function updateView() {
            viewGroup.setAttribute('transform', 'translate(' + panX + ',' + panY + ') scale(' + zoom + ')');

            // マス目の下地は、いま見えている範囲を覆うだけの大きさにする
            const r = svg.getBoundingClientRect();
            const x0 = Math.floor((-panX / zoom) / GRID_SIZE) * GRID_SIZE - GRID_SIZE;
            const y0 = Math.floor((-panY / zoom) / GRID_SIZE) * GRID_SIZE - GRID_SIZE;
            gridRect.setAttribute('x', x0);
            gridRect.setAttribute('y', y0);
            gridRect.setAttribute('width', r.width / zoom + GRID_SIZE * 3);
            gridRect.setAttribute('height', r.height / zoom + GRID_SIZE * 3);

            // 指で押す目印は、倍率が変わっても画面上の大きさが同じになるようにする
            snapMarker.setAttribute('r', 9 / zoom);

            const label = document.getElementById('btn-zoom-label');
            if (label) label.textContent = '🔍 ' + Math.round(zoom * 100) + '%';
            const out = document.getElementById('btn-zoom-out');
            const inn = document.getElementById('btn-zoom-in');
            if (out) out.classList.toggle('is-disabled', zoom <= ZOOM_STEPS[0]);
            if (inn) inn.classList.toggle('is-disabled', zoom >= ZOOM_STEPS[ZOOM_STEPS.length - 1]);
        }

        // 画面の真ん中を動かさずに倍率だけ変える
        function setZoom(next) {
            const r = svg.getBoundingClientRect();
            const cx = r.width / 2, cy = r.height / 2;
            const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
            zoom = next;
            panX = cx - zoom * wx;
            panY = cy - zoom * wy;
            updateView();
            renderShapes(); // 線の太さや印の大きさを引き直す
        }

        function zoomStep(dir) {
            let i = ZOOM_STEPS.indexOf(zoom);
            if (i < 0) i = ZOOM_STEPS.indexOf(1);
            const j = Math.max(0, Math.min(ZOOM_STEPS.length - 1, i + dir));
            if (ZOOM_STEPS[j] === zoom) {
                showToast(dir > 0 ? 'これ以上大きくできません' : 'これ以上小さくできません');
                return;
            }
            setZoom(ZOOM_STEPS[j]);
            showToast('🔍 マスの大きさ ' + Math.round(zoom * 100) + '%');
        }

        function resetZoom() {
            if (zoom === 1) {
                showToast('🔍 いま100%です');
                return;
            }
            setZoom(1);
            showToast('🔍 マスの大きさを100%に戻しました');
        }

        // ならべたものが画面に収まる倍率まで小さくする（リンクから開いたとき用）
        function fitZoomTo(wUnits, hUnits) {
            const r = svg.getBoundingClientRect();
            if (!r.width || !r.height) return;
            let i = ZOOM_STEPS.indexOf(zoom);
            if (i < 0) i = ZOOM_STEPS.indexOf(1);
            for (let j = i; j >= 0; j--) {
                const fitW = wUnits * GRID_SIZE * ZOOM_STEPS[j] <= r.width - 24;
                const fitH = hUnits * GRID_SIZE * ZOOM_STEPS[j] <= r.height - 24;
                if (fitW && fitH) {
                    if (ZOOM_STEPS[j] !== zoom) setZoom(ZOOM_STEPS[j]);
                    return;
                }
            }
            setZoom(ZOOM_STEPS[0]);
        }

        window.addEventListener('resize', updateView);

        // Interaction State
        let isDragging = false;
        let isCutting = false;
        let isGuiding = false;
        let dragTarget = null;
        let startPt = {x: 0, y: 0};
        let cutStartPt = {x: 0, y: 0};
        let guideStartPt = {x: 0, y: 0};
        let preDragState = null;   // ドラッグ開始時の状態（実際に動いたときだけ履歴に積む）
        let anchorX = 0;           // マス目に合わせる基準（横）
        let anchorY = 0;           // マス目に合わせる基準（縦）

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById('btn-' + tool);
            if (btn) btn.classList.add('active');

            // 補助線をタップして消せるのは「消す」のときだけ
            guidesLayer.classList.toggle('pickable', tool === 'erase');

            const messages = {
                'move': '👆 図形をドラッグして移動させよう',
                'cut': '✂️ スワイプして切ろう。とちゅうで止めると切りこみになるよ',
                'rotate': '🔄 図形をタップして45度回そう',
                'flip': '🪞 折り目にしたい辺の近くをタップしてうら返そう',
                'color': '🎨 図形をタップして色を変えよう',
                'guide': '📏 スワイプして補助線を引こう',
                'erase': '🧽 消したい図形や補助線をタップしよう'
            };
            showToast(messages[tool]);
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0.7'; }, 2000);
        }

        // ===== 履歴管理（もどる・すすむ） =====

        // 現在の図形の状態を複製して取り出す
        function cloneShapes(list) {
            return list.map(s => {
                const out = {
                    id: s.id,
                    points: s.points.map(p => ({x: p.x, y: p.y})),
                    color: {fill: s.color.fill, stroke: s.color.stroke}
                };
                if (s.cutPath && s.cutPath.length) out.cutPath = s.cutPath.map(p => ({x: p.x, y: p.y}));
                return out;
            });
        }

        function cloneGuides(list) {
            return list.map(g => ({id: g.id, x1: g.x1, y1: g.y1, x2: g.x2, y2: g.y2}));
        }

        function snapshot() {
            return {
                shapes: cloneShapes(shapes),
                placed: cloneShapes(placedShapes),
                guides: cloneGuides(guides)
            };
        }

        function restore(state) {
            shapes = cloneShapes(state.shapes);
            placedShapes = cloneShapes(state.placed);
            guides = cloneGuides(state.guides || []);
        }

        // 履歴に積む（新しい操作をしたら「すすむ」履歴は破棄）
        function pushHistory(state) {
            historyStack.push(state);
            if (historyStack.length > 30) historyStack.shift();
            redoStack = [];
            updateHistoryButtons();
        }

        // 変更前に呼ぶ
        function saveState() {
            pushHistory(snapshot());
        }

        function undo() {
            if (historyStack.length === 0) {
                showToast('これ以上もどれません');
                return;
            }
            redoStack.push(snapshot());
            restore(historyStack.pop());
            renderShapes();
            updateHistoryButtons();
            showToast('↩️ 1つ前にもどしました');
        }

        function redo() {
            if (redoStack.length === 0) {
                showToast('これ以上すすめません');
                return;
            }
            historyStack.push(snapshot());
            restore(redoStack.pop());
            renderShapes();
            updateHistoryButtons();
            showToast('↪️ 1つ先にすすめました');
        }

        // 2つの図形リストが同じ形・同じ位置・同じ切りこみかどうか
        function sameShapes(a, b) {
            if (a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (a[i].points.length !== b[i].points.length) return false;
                if (a[i].color.fill !== b[i].color.fill) return false;
                for (let j = 0; j < a[i].points.length; j++) {
                    if (Math.abs(a[i].points[j].x - b[i].points[j].x) > 0.01) return false;
                    if (Math.abs(a[i].points[j].y - b[i].points[j].y) > 0.01) return false;
                }
                const ca = a[i].cutPath || [];
                const cb = b[i].cutPath || [];
                if (ca.length !== cb.length) return false;
                for (let j = 0; j < ca.length; j++) {
                    if (Math.abs(ca[j].x - cb[j].x) > 0.01) return false;
                    if (Math.abs(ca[j].y - cb[j].y) > 0.01) return false;
                }
            }
            return true;
        }

        // 図形を置いた直後の状態に戻す（切る・動かす・回す・色ぬりを取り消す）
        // 補助線は残ります（黒板の書きこみと同じあつかい）
        function resetToPlaced() {
            if (placedShapes.length === 0) {
                showToast('先に図形を追加してね');
                return;
            }
            if (sameShapes(shapes, placedShapes)) {
                showToast('もう置いたときの状態です');
                return;
            }
            saveState();
            shapes = cloneShapes(placedShapes);
            renderShapes();
            setTool('move');
            showToast('♻️ 置いたときの状態に戻しました');
        }

        // 図形も補助線も全部消して最初から。※もどるで元に戻せます
        function clearAll() {
            if (shapes.length === 0 && placedShapes.length === 0 && guides.length === 0) {
                showToast('図形はありません');
                return;
            }
            saveState();
            shapes = [];
            placedShapes = [];
            guides = [];
            renderShapes();
            setTool('move');
            showToast('🗑️ 全て消しました');
        }

        function updateHistoryButtons() {
            const undoBtn = document.getElementById('btn-undo');
            const redoBtn = document.getElementById('btn-redo');
            undoBtn.classList.toggle('is-disabled', historyStack.length === 0);
            redoBtn.classList.toggle('is-disabled', redoStack.length === 0);
        }

        // ===== マス目スナップ =====

        // Snaps a value to the nearest grid intersection
        function snap(val) {
            return Math.round(val / GRID_SIZE) * GRID_SIZE;
        }

        // いちばんマスの線に近い頂点の座標を基準として返す
        function findAnchor(points, axis) {
            let best = points[0][axis];
            let bestErr = Math.abs(snap(best) - best);
            for (const p of points) {
                const err = Math.abs(snap(p[axis]) - p[axis]);
                if (err < bestErr - 0.0001) {
                    bestErr = err;
                    best = p[axis];
                }
            }
            return best;
        }

        // ドラッグ中の移動量を決める（上から順に優先）
        // ①ほかの図形の頂点にピッタリ重ねる → 隙間ができない
        // ②ほかの図形の辺の上にのせる       → 斜めの辺でもピッタリつく
        // ③どちらも近くになければマスの交点に合わせる
        function computeSnap(rawDx, rawDy) {
            const orig = dragTarget.originalPoints;
            let best = null;
            let bestDist = SNAP_DIST;

            for (const shape of shapes) {
                if (shape === dragTarget) continue;
                for (const q of shape.points) {
                    for (const p of orig) {
                        const d = Math.hypot(q.x - (p.x + rawDx), q.y - (p.y + rawDy));
                        if (d < bestDist) {
                            bestDist = d;
                            best = { dx: q.x - p.x, dy: q.y - p.y, marker: {x: q.x, y: q.y} };
                        }
                    }
                }
            }
            if (best) return best;

            // ②頂点をほかの図形の辺の上にのせる（少し近づけないとくっつかない）
            let bestEdge = null;
            let bestEdgeDist = SNAP_DIST * 0.6;
            for (const shape of shapes) {
                if (shape === dragTarget) continue;
                const n = shape.points.length;
                for (let i = 0; i < n; i++) {
                    const a = shape.points[i];
                    const b = shape.points[(i + 1) % n];
                    for (const p of orig) {
                        const m = {x: p.x + rawDx, y: p.y + rawDy};
                        const proj = closestPointOnSegment(m, a, b);
                        const d = Math.hypot(proj.x - m.x, proj.y - m.y);
                        if (d < bestEdgeDist) {
                            bestEdgeDist = d;
                            bestEdge = { dx: proj.x - p.x, dy: proj.y - p.y, marker: {x: proj.x, y: proj.y} };
                        }
                    }
                }
            }
            if (bestEdge) return bestEdge;

            // ③マスの交点に合わせる（基準はいちばん線に近い頂点）
            return {
                dx: snap(anchorX + rawDx) - anchorX,
                dy: snap(anchorY + rawDy) - anchorY,
                marker: null
            };
        }

        // 線分ABの上で、点Pにいちばん近い場所を返す
        function closestPointOnSegment(p, a, b) {
            const vx = b.x - a.x;
            const vy = b.y - a.y;
            const len2 = vx * vx + vy * vy;
            if (len2 < 0.0001) return {x: a.x, y: a.y};
            let t = ((p.x - a.x) * vx + (p.y - a.y) * vy) / len2;
            t = Math.max(0, Math.min(1, t));
            return {x: a.x + vx * t, y: a.y + vy * t};
        }

        // くっつく先の頂点を光らせる
        function showSnapMarker(pos) {
            if (!pos) {
                snapMarker.style.display = 'none';
                return;
            }
            snapMarker.setAttribute('cx', pos.x);
            snapMarker.setAttribute('cy', pos.y);
            snapMarker.style.display = 'block';
        }

        // 画面上の指の位置を、図形の座標に直す（拡大・縮小の分もここで戻ります）
        function getMousePos(evt) {
            let pt = svg.createSVGPoint();
            pt.x = (typeof evt.clientX === 'number') ? evt.clientX : 0;
            pt.y = (typeof evt.clientY === 'number') ? evt.clientY : 0;
            return pt.matrixTransform(viewGroup.getScreenCTM().inverse());
        }

        // ===== 図形のかたち（数値はすべて「マス目の数」）=====
        // 左上を(0,0)としたマス目座標をつくる。すべて整数なので頂点は必ずマスの交点に乗る。
        const SHAPE_SPECS = {
            triangle: {
                name: '三角形',
                color: {fill: '#fca5a5', stroke: '#ef4444'},
                params: [
                    {key: 'base',   label: '底辺',           min: 1, max: 16, def: 6},
                    {key: 'height', label: '高さ',           min: 1, max: 12, def: 4},
                    {key: 'apex',   label: '頂点（左から）', min: 0, max: 16, def: 4}
                ],
                build: p => [[0, p.height], [p.base, p.height], [p.apex, 0]]
            },
            righttriangle: {
                name: '直角三角形',
                color: {fill: '#fdba74', stroke: '#f97316'},
                params: [
                    {key: 'base',   label: '底辺', min: 1, max: 16, def: 6},
                    {key: 'height', label: '高さ', min: 1, max: 12, def: 4},
                    {key: 'corner', label: '直角の位置', def: 'br',
                     options: [['bl','左下'], ['br','右下'], ['tl','左上'], ['tr','右上']]}
                ],
                build: p => {
                    const b = p.base, h = p.height;
                    if (p.corner === 'bl') return [[0,0], [0,h], [b,h]];
                    if (p.corner === 'tl') return [[0,0], [b,0], [0,h]];
                    if (p.corner === 'tr') return [[0,0], [b,0], [b,h]];
                    return [[0,h], [b,h], [b,0]]; // br
                }
            },
            quadrilateral: {
                name: '四角形',
                color: {fill: '#93c5fd', stroke: '#3b82f6'},
                params: [
                    {key: 'width',  label: 'よこ', min: 1, max: 16, def: 6},
                    {key: 'height', label: 'たて', min: 1, max: 12, def: 4}
                ],
                build: p => [[0,0], [p.width,0], [p.width,p.height], [0,p.height]]
            },
            parallelogram: {
                name: '平行四辺形',
                color: {fill: '#fde047', stroke: '#eab308'},
                params: [
                    {key: 'base',   label: '底辺',       min: 1, max: 16, def: 6},
                    {key: 'height', label: '高さ',       min: 1, max: 12, def: 4},
                    {key: 'shift',  label: '上辺のずれ', min: 0, max: 10, def: 2},
                    {key: 'dir',    label: '傾き', def: 'lt',
                     options: [['lt','左上→右下'], ['rt','右上→左下']]}
                ],
                build: p => {
                    const b = p.base, h = p.height, s = p.shift;
                    if (p.dir === 'rt') return [[s,0], [s+b,0], [b,h], [0,h]];
                    return [[0,0], [b,0], [b+s,h], [s,h]]; // lt
                }
            },
            trapezoid: {
                name: '台形',
                color: {fill: '#d8b4fe', stroke: '#a855f7'},
                params: [
                    {key: 'upper',  label: '上底',           min: 1, max: 16, def: 3},
                    {key: 'lower',  label: '下底',           min: 1, max: 16, def: 9},
                    {key: 'height', label: '高さ',           min: 1, max: 12, def: 4},
                    {key: 'offset', label: '上底（左から）', min: 0, max: 14, def: 4}
                ],
                build: p => [[p.offset,0], [p.offset+p.upper,0], [p.lower,p.height], [0,p.height]]
            },
            rhombus: {
                name: 'ひし形',
                color: {fill: '#86efac', stroke: '#22c55e'},
                params: [
                    // 頂点をマスの交点に乗せるため2マスずつ変わります
                    {key: 'dh', label: '対角線（よこ）', min: 2, max: 16, def: 8, step: 2},
                    {key: 'dv', label: '対角線（たて）', min: 2, max: 12, def: 4, step: 2}
                ],
                build: p => [[p.dh/2,0], [p.dh,p.dv/2], [p.dh/2,p.dv], [0,p.dv/2]]
            }
        };

        // 保存キー。末尾の番号を変えると、前に保存された「大きさ」を読まずに
        // コードに書いた初期値から始まります（初期値を変えたときはここも上げる）
        const STORAGE_KEY = 'tkk-zukei-shape-params-v2';
        let shapeParams = {};
        let settingsType = 'triangle';

        function defaultParams(type) {
            const out = {};
            SHAPE_SPECS[type].params.forEach(p => { out[p.key] = p.def; });
            return out;
        }

        function loadShapeParams() {
            Object.keys(SHAPE_SPECS).forEach(t => { shapeParams[t] = defaultParams(t); });
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (saved) {
                    Object.keys(SHAPE_SPECS).forEach(t => {
                        if (!saved[t]) return;
                        SHAPE_SPECS[t].params.forEach(p => {
                            const v = saved[t][p.key];
                            if (p.options) {
                                if (p.options.some(o => o[0] === v)) shapeParams[t][p.key] = v;
                            } else if (typeof v === 'number' && v >= p.min && v <= p.max) {
                                shapeParams[t][p.key] = v;
                            }
                        });
                    });
                }
            } catch (err) { /* 保存が使えない環境ではその場かぎりの設定になります */ }
        }

        function saveShapeParams() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(shapeParams)); } catch (err) { /* 無視 */ }
        }

        // 設定値からマス目座標をつくる（左上が(0,0)になるようにそろえる）
        function buildUnits(type) {
            let units = SHAPE_SPECS[type].build(shapeParams[type]);
            const minX = Math.min(...units.map(u => u[0]));
            const minY = Math.min(...units.map(u => u[1]));
            return units.map(u => [u[0] - minX, u[1] - minY]);
        }

        // マス目いくつ分の面積か
        function unitArea(units) {
            let a = 0;
            for (let i = 0; i < units.length; i++) {
                const j = (i + 1) % units.length;
                a += units[i][0] * units[j][1] - units[j][0] * units[i][1];
            }
            return Math.round(Math.abs(a) / 2 * 100) / 100;
        }

        // ===== 設定のリンク化・QRコード =====

        // 設定を短い文字列にする（図形は「_」、項目は「.」区切り）
        function encodeShapeParams() {
            return Object.keys(SHAPE_SPECS).map(type =>
                SHAPE_SPECS[type].params.map(p => shapeParams[type][p.key]).join('.')
            ).join('_');
        }

        // 文字列から設定を復元する。おかしな値は初期値のまま使う
        function decodeShapeParams(str) {
            const types = Object.keys(SHAPE_SPECS);
            const parts = String(str).split('_');
            if (parts.length !== types.length) return false;
            const next = {};
            types.forEach((type, i) => {
                next[type] = defaultParams(type);
                const vals = parts[i].split('.');
                SHAPE_SPECS[type].params.forEach((p, j) => {
                    const raw = vals[j];
                    if (raw === undefined) return;
                    if (p.options) {
                        if (p.options.some(o => o[0] === raw)) next[type][p.key] = raw;
                    } else {
                        const v = parseInt(raw, 10);
                        if (Number.isFinite(v) && v >= p.min && v <= p.max) next[type][p.key] = v;
                    }
                });
            });
            shapeParams = next;
            return true;
        }

        // 図形と補助線をまとめた左上の位置。これを基準にするので、
        // 画面の大きさが違ってもならびがくずれません
        function sceneOrigin() {
            const xs = [], ys = [];
            shapes.forEach(s => s.points.forEach(p => { xs.push(p.x); ys.push(p.y); }));
            guides.forEach(g => { xs.push(g.x1, g.x2); ys.push(g.y1, g.y2); });
            if (!xs.length) return null;
            return {x: Math.min(...xs), y: Math.min(...ys)};
        }

        const round2 = v => Math.round(v * 100) / 100;

        // 画面に置いてある図形を文字列にする（図形は「~」、数値は「,」区切り）
        function encodeCanvas() {
            const o = sceneOrigin();
            if (!o || !shapes.length) return '';
            return shapes.map(s => {
                let ci = colors.findIndex(c => c.fill === s.color.fill);
                if (ci < 0) ci = 0;
                const nums = [];
                s.points.forEach(p => {
                    nums.push(round2((p.x - o.x) / GRID_SIZE));
                    nums.push(round2((p.y - o.y) / GRID_SIZE));
                });
                return [ci].concat(nums).join(',');
            }).join('~');
        }

        // 補助線を文字列にする（1本につき x1,y1,x2,y2）
        function encodeGuides() {
            const o = sceneOrigin();
            if (!o || !guides.length) return '';
            return guides.map(g => [
                round2((g.x1 - o.x) / GRID_SIZE), round2((g.y1 - o.y) / GRID_SIZE),
                round2((g.x2 - o.x) / GRID_SIZE), round2((g.y2 - o.y) / GRID_SIZE)
            ].join(',')).join('~');
        }

        function parseCanvas(str) {
            const groups = String(str).split('~').filter(Boolean);
            if (!groups.length || groups.length > 80) return null;
            const list = [];
            for (const g of groups) {
                const nums = g.split(',');
                const ci = parseInt(nums[0], 10);
                const coords = nums.slice(1).map(Number);
                if (coords.length < 6 || coords.length % 2 !== 0) return null;
                if (!coords.every(v => Number.isFinite(v) && Math.abs(v) < 500)) return null;
                const units = [];
                for (let i = 0; i < coords.length; i += 2) units.push({x: coords[i], y: coords[i + 1]});
                const color = (Number.isFinite(ci) && ci >= 0 && ci < colors.length) ? colors[ci] : colors[0];
                list.push({units, color});
            }
            return list;
        }

        function parseGuides(str) {
            const groups = String(str).split('~').filter(Boolean);
            if (!groups.length || groups.length > 60) return null;
            const list = [];
            for (const g of groups) {
                const v = g.split(',').map(Number);
                if (v.length !== 4) return null;
                if (!v.every(n => Number.isFinite(n) && Math.abs(n) < 500)) return null;
                list.push(v);
            }
            return list;
        }

        // 文字列から図形と補助線を並べ直す（まとめて画面の中央あたりに置く）
        function decodeScene(zStr, gStr) {
            const shapeList = zStr ? parseCanvas(zStr) : [];
            const guideList = gStr ? parseGuides(gStr) : [];
            if (shapeList === null || guideList === null) return false;
            if (!shapeList.length && !guideList.length) return false;

            const xs = [], ys = [];
            shapeList.forEach(s => s.units.forEach(p => { xs.push(p.x); ys.push(p.y); }));
            guideList.forEach(v => { xs.push(v[0], v[2]); ys.push(v[1], v[3]); });
            const minX = Math.min(...xs), minY = Math.min(...ys);
            const w = Math.max(...xs) - minX, h = Math.max(...ys) - minY;

            // 画面に収まらないほど大きなならびなら、マスを小さくして全部見えるようにする
            fitZoomTo(w, h);

            const c = viewCenterWorld();
            const ox = snap(c.x - (w * GRID_SIZE) / 2);
            const oy = snap(c.y - (h * GRID_SIZE) / 2);
            const toPx = (ux, uy) => ({x: ox + (ux - minX) * GRID_SIZE, y: oy + (uy - minY) * GRID_SIZE});

            shapes = shapeList.map(s => ({
                id: 'shape_' + shapeIdCounter++,
                points: s.units.map(p => toPx(p.x, p.y)),
                color: {fill: s.color.fill, stroke: s.color.stroke}
            }));
            // 「リセット」で先生が仕込んだこの状態に戻れるようにする
            placedShapes = cloneShapes(shapes);
            guides = guideList.map(v => {
                const a = toPx(v[0], v[1]);
                const b = toPx(v[2], v[3]);
                return {id: 'guide_' + guideIdCounter++, x1: a.x, y1: a.y, x2: b.x, y2: b.y};
            });
            return true;
        }

        // アドレスに図形や補助線がついていれば読み込む
        function applyLinkScene() {
            const hash = String(location.hash || '');
            const z = hash.match(/[#&]z=([^&]+)/);
            const g = hash.match(/[#&]g=([^&]+)/);
            if (!z && !g) return false;
            try {
                return decodeScene(z ? decodeURIComponent(z[1]) : '', g ? decodeURIComponent(g[1]) : '');
            } catch (err) {
                return false;
            }
        }

        // アドレスに設定がついていれば読み込む
        function applyLinkParams() {
            const m = String(location.hash || '').match(/[#&]s=([^&]+)/);
            if (!m) return false;
            try {
                return decodeShapeParams(decodeURIComponent(m[1]));
            } catch (err) {
                return false;
            }
        }

        let includeCanvas = true; // いまの図形もリンクに入れるか

        function buildShareUrl() {
            const base = location.origin + location.pathname + location.search;
            let url = base + '#s=' + encodeShapeParams();
            if (includeCanvas) {
                const z = encodeCanvas();
                if (z) url += '&z=' + z;
                const g = encodeGuides();
                if (g) url += '&g=' + g;
            }
            return url;
        }

        function toggleShareInclude() {
            includeCanvas = !includeCanvas;
            refreshShare();
        }

        function refreshShare() {
            const url = buildShareUrl();
            document.getElementById('share-url').textContent = url;

            // 「いまの図形も入れる」ボタンの表示
            const tgl = document.getElementById('share-include');
            const on = includeCanvas && (shapes.length > 0 || guides.length > 0);
            tgl.textContent = (on ? '☑' : '☐') + ' いまの図形も入れる（図形' + shapes.length + '個・補助線' + guides.length + '本）';
            tgl.className = 'w-full px-3 py-2 rounded-xl font-bold text-sm border ' +
                (on ? 'bg-slate-600 text-white border-slate-700' : 'bg-gray-100 text-gray-600 border-gray-300');

            // QRコードをつくる（誤り訂正レベルM、サイズは自動）
            const box = document.getElementById('share-qr');
            try {
                const qr = qrcode(0, 'M');
                qr.addData(url);
                qr.make();
                box.innerHTML = qr.createSvgTag({cellSize: 4, margin: 4, scalable: true});
                const svgEl = box.querySelector('svg');
                svgEl.setAttribute('width', '100%');
                svgEl.setAttribute('height', '100%');
            } catch (err) {
                box.innerHTML = '<p class="text-xs text-gray-500 p-2">図形が多すぎてQRコードを作れませんでした。図形を減らすか、「いまの図形も入れる」をオフにしてください。</p>';
            }

            // 注意書き
            const note = document.getElementById('share-note');
            const msgs = [];
            if (location.protocol === 'file:') {
                msgs.push('いまファイルを直接開いているため、このリンクは他の端末では開けません。ウェブに置いたページから作ってください。');
            }
            if (url.length > 500) {
                msgs.push('図形が多いためQRコードが細かくなっています。読み取りにくいときは大きめに印刷してください。');
            }
            if (msgs.length) {
                note.innerHTML = msgs.join('<br>');
                note.style.display = 'block';
            } else {
                note.style.display = 'none';
            }
        }

        function openShare() {
            if (!shapes.length && !guides.length) includeCanvas = false;
            refreshShare();
            document.getElementById('share-overlay').style.display = 'flex';
        }

        function closeShare() {
            document.getElementById('share-overlay').style.display = 'none';
        }

        function copyShareUrl() {
            const url = buildShareUrl();
            const done = () => showToast('🔗 リンクをコピーしました');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
            } else {
                fallbackCopy(url, done);
            }
        }

        function fallbackCopy(text, done) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); done(); } catch (err) { showToast('コピーできませんでした'); }
            document.body.removeChild(ta);
        }

        // ===== 図形メニューと設定パネル =====

        // 設定にあわせたミニ図形のSVGをつくる
        function iconSvg(type, size) {
            const units = buildUnits(type);
            const w = Math.max(...units.map(u => u[0])) || 1;
            const h = Math.max(...units.map(u => u[1])) || 1;
            const c = SHAPE_SPECS[type].color;
            const pts = units.map(u => u[0] + ',' + u[1]).join(' ');
            const m = 0.25;
            return '<svg width="' + size + '" height="' + size + '" viewBox="' +
                (-m) + ' ' + (-m) + ' ' + (w + m*2) + ' ' + (h + m*2) +
                '" preserveAspectRatio="xMidYMid meet"><polygon points="' + pts +
                '" fill="' + c.fill + '" stroke="' + c.stroke +
                '" stroke-width="0.18" stroke-linejoin="round"/></svg>';
        }

        function renderMenu() {
            const menu = document.getElementById('shape-menu');
            menu.innerHTML = '';
            Object.keys(SHAPE_SPECS).forEach(type => {
                const btn = document.createElement('button');
                btn.className = 'flex-shrink-0 bg-green-50 hover:bg-green-100 border-2 border-green-400 rounded-xl p-3 flex flex-col items-center gap-2 transition-transform hover:scale-105 active:scale-95';
                btn.onclick = () => addShape(type);
                btn.innerHTML = iconSvg(type, 40) +
                    '<span class="text-sm font-bold text-green-800">' + SHAPE_SPECS[type].name + '</span>';
                menu.appendChild(btn);
            });
        }

        function openSettings() {
            document.getElementById('settings-overlay').style.display = 'flex';
            renderSettings();
        }

        function closeSettings() {
            document.getElementById('settings-overlay').style.display = 'none';
        }

        function selectSettingsType(type) {
            settingsType = type;
            renderSettings();
        }

        function renderSettings() {
            const spec = SHAPE_SPECS[settingsType];

            // 図形のタブ
            const tabs = document.getElementById('settings-tabs');
            tabs.innerHTML = '';
            Object.keys(SHAPE_SPECS).forEach(type => {
                const b = document.createElement('button');
                b.className = 'tab-btn px-3 py-1 rounded-full text-xs font-bold border border-green-300 bg-green-50 text-green-800' +
                    (type === settingsType ? ' active' : '');
                b.textContent = SHAPE_SPECS[type].name;
                b.onclick = () => selectSettingsType(type);
                tabs.appendChild(b);
            });

            // プレビューと面積
            const units = buildUnits(settingsType);
            const w = Math.max(...units.map(u => u[0]));
            const h = Math.max(...units.map(u => u[1]));
            let grid = '';
            for (let x = 0; x <= w; x++) grid += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + h + '" stroke="#cbd5e1" stroke-width="0.05"/>';
            for (let y = 0; y <= h; y++) grid += '<line x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="#cbd5e1" stroke-width="0.05"/>';
            const c = spec.color;
            const pts = units.map(u => u[0] + ',' + u[1]).join(' ');
            const m = 0.4;
            document.getElementById('settings-preview').innerHTML =
                '<svg width="100%" height="150" viewBox="' + (-m) + ' ' + (-m) + ' ' + (w + m*2) + ' ' + (h + m*2) +
                '" preserveAspectRatio="xMidYMid meet">' + grid +
                '<polygon points="' + pts + '" fill="' + c.fill + '" fill-opacity="0.7" stroke="' + c.stroke +
                '" stroke-width="0.12" stroke-linejoin="round"/></svg>' +
                '<p class="text-sm font-bold text-gray-600">面積 ' + unitArea(units) + ' マス</p>';

            // 数値の調節
            const fields = document.getElementById('settings-fields');
            fields.innerHTML = '';
            spec.params.forEach(p => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between gap-2';
                const label = document.createElement('span');
                label.className = 'text-sm font-bold text-gray-700';
                label.textContent = p.label;
                row.appendChild(label);

                const ctrl = document.createElement('div');
                ctrl.className = 'flex items-center gap-1';

                if (p.options) {
                    p.options.forEach(o => {
                        const b = document.createElement('button');
                        b.className = 'opt-btn px-2 py-1 rounded-lg text-xs font-bold border border-gray-300 bg-gray-50 text-gray-700' +
                            (shapeParams[settingsType][p.key] === o[0] ? ' active' : '');
                        b.textContent = o[1];
                        b.onclick = () => setParam(p.key, o[0]);
                        ctrl.appendChild(b);
                    });
                } else {
                    const step = p.step || 1;
                    const minus = document.createElement('button');
                    minus.className = 'w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 border border-gray-300 font-bold text-lg leading-none';
                    minus.textContent = '－';
                    minus.onclick = () => bumpParam(p.key, -step);
                    const val = document.createElement('span');
                    val.className = 'w-8 text-center font-bold text-lg text-gray-800';
                    val.textContent = shapeParams[settingsType][p.key];
                    const plus = document.createElement('button');
                    plus.className = 'w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 border border-gray-300 font-bold text-lg leading-none';
                    plus.textContent = '＋';
                    plus.onclick = () => bumpParam(p.key, step);
                    ctrl.appendChild(minus);
                    ctrl.appendChild(val);
                    ctrl.appendChild(plus);
                }
                row.appendChild(ctrl);
                fields.appendChild(row);
            });
        }

        function bumpParam(key, delta) {
            const p = SHAPE_SPECS[settingsType].params.find(q => q.key === key);
            let v = shapeParams[settingsType][key] + delta;
            v = Math.max(p.min, Math.min(p.max, v));
            shapeParams[settingsType][key] = v;
            afterParamChange();
        }

        function setParam(key, value) {
            shapeParams[settingsType][key] = value;
            afterParamChange();
        }

        function afterParamChange() {
            saveShapeParams();
            renderSettings();
            renderMenu();
        }

        function resetShapeParams() {
            shapeParams[settingsType] = defaultParams(settingsType);
            afterParamChange();
            showToast('⚙️ ' + SHAPE_SPECS[settingsType].name + 'を初期値にもどしました');
        }

        function addFromSettings() {
            addShape(settingsType);
            closeSettings();
        }

        // Add predefined shapes centered in view
        function addShape(type) {
            const spec = SHAPE_SPECS[type];
            if (!spec) return;
            const def = buildUnits(type);

            // マス目の数から実際の大きさを求める
            const w = Math.max(...def.map(u => u[0]));
            const h = Math.max(...def.map(u => u[1]));

            // いま見えている範囲の中央に置く。左上の基準点をマスの交点にそろえる
            const c = viewCenterWorld();
            const ox = snap(c.x - (w * GRID_SIZE) / 2);
            const oy = snap(c.y - (h * GRID_SIZE) / 2);

            const points = def.map(u => ({
                x: ox + u[0] * GRID_SIZE,
                y: oy + u[1] * GRID_SIZE
            }));

            let colorSet = colors[placedShapes.length % colors.length];
            saveState(); // 図形追加前に状態を保存
            let newShape = {
                id: 'shape_' + shapeIdCounter++,
                points: points,
                color: colorSet
            };
            shapes.push(newShape);
            // 「リセット」で戻すために、置いたときの姿を記録しておく
            placedShapes.push({
                id: newShape.id,
                points: points.map(p => ({x: p.x, y: p.y})),
                color: {fill: colorSet.fill, stroke: colorSet.stroke}
            });

            renderShapes();
            setTool('move');
        }

        // ===== 画面に描く =====

        function renderShapes() {
            shapesLayer.innerHTML = ''; // Clear layer

            shapes.forEach((shape, index) => {
                let polygon = document.createElementNS(SVG_NS, "polygon");
                let pointsStr = shape.points.map(p => `${p.x},${p.y}`).join(" ");
                polygon.setAttribute("points", pointsStr);
                polygon.setAttribute("fill", shape.color.fill);
                polygon.setAttribute("fill-opacity", "0.7"); // 塗りつぶしを70%の不透明度にして重なりを見やすく
                polygon.setAttribute("stroke", shape.color.stroke);
                polygon.setAttribute("stroke-linejoin", "round");
                polygon.setAttribute("stroke-width", "2");
                polygon.setAttribute("vector-effect", "non-scaling-stroke");
                polygon.setAttribute("class", "shape-polygon");
                polygon.setAttribute("data-id", shape.id);
                polygon.setAttribute("data-index", index);

                // Add shadow for better depth
                polygon.setAttribute("filter", "drop-shadow(2px 2px 2px rgba(0,0,0,0.2))");

                shapesLayer.appendChild(polygon);
            });

            renderCutPaths();
            renderGuides();
        }

        // とちゅうで止まっている切りこみを赤い点線で描く
        function renderCutPaths() {
            cutLayer.innerHTML = '';
            shapes.forEach(shape => {
                if (!shape.cutPath || shape.cutPath.length < 2) return;
                const pl = document.createElementNS(SVG_NS, 'polyline');
                pl.setAttribute('points', shape.cutPath.map(p => p.x + ',' + p.y).join(' '));
                pl.setAttribute('fill', 'none');
                pl.setAttribute('stroke', '#ef4444');
                pl.setAttribute('stroke-width', '3');
                pl.setAttribute('vector-effect', 'non-scaling-stroke');
                pl.setAttribute('stroke-dasharray', '7,5');
                pl.setAttribute('stroke-linecap', 'round');
                pl.setAttribute('stroke-linejoin', 'round');
                cutLayer.appendChild(pl);

                // 「ここから続けて切れるよ」という印
                [shape.cutPath[0], shape.cutPath[shape.cutPath.length - 1]].forEach(p => {
                    const c = document.createElementNS(SVG_NS, 'circle');
                    c.setAttribute('cx', p.x);
                    c.setAttribute('cy', p.y);
                    c.setAttribute('r', 4.5 / zoom); // 倍率が変わっても同じ大きさに見えるように
                    c.setAttribute('fill', '#ffffff');
                    c.setAttribute('stroke', '#ef4444');
                    c.setAttribute('stroke-width', '2.5');
                    c.setAttribute('vector-effect', 'non-scaling-stroke');
                    cutLayer.appendChild(c);
                });
            });
        }

        function renderGuides() {
            guidesLayer.innerHTML = '';
            guides.forEach(g => {
                // 指でも押しやすいように、見えない太い線を下に重ねる
                const hit = document.createElementNS(SVG_NS, 'line');
                hit.setAttribute('x1', g.x1); hit.setAttribute('y1', g.y1);
                hit.setAttribute('x2', g.x2); hit.setAttribute('y2', g.y2);
                hit.setAttribute('stroke', 'transparent');
                hit.setAttribute('stroke-width', 20 / zoom); // 指で押しやすい太さを保つ
                hit.setAttribute('stroke-linecap', 'round');
                hit.setAttribute('pointer-events', 'stroke');
                hit.setAttribute('data-guide-id', g.id);
                guidesLayer.appendChild(hit);

                const vis = document.createElementNS(SVG_NS, 'line');
                vis.setAttribute('x1', g.x1); vis.setAttribute('y1', g.y1);
                vis.setAttribute('x2', g.x2); vis.setAttribute('y2', g.y2);
                vis.setAttribute('stroke', '#475569');
                vis.setAttribute('stroke-width', '2.5');
                vis.setAttribute('vector-effect', 'non-scaling-stroke');
                vis.setAttribute('stroke-dasharray', '8,6');
                vis.setAttribute('stroke-linecap', 'round');
                vis.setAttribute('pointer-events', 'none');
                guidesLayer.appendChild(vis);
            });
        }

        // マウス・タッチ・ペンをまとめて扱う（Pointer Events）
        let activePointerId = null;

        svg.addEventListener('pointerdown', onPointerDown);
        svg.addEventListener('pointermove', onPointerMove);
        svg.addEventListener('pointerup', onPointerUp);
        svg.addEventListener('pointercancel', onPointerUp);

        function onPointerDown(e) {
            if (activePointerId !== null) return;              // 2本目の指は無視する
            if (e.pointerType === 'mouse' && e.button !== 0) return; // 右クリックは無視
            e.preventDefault();
            activePointerId = e.pointerId;
            // 指が図形の外に出ても操作が続くようにする
            try { svg.setPointerCapture(e.pointerId); } catch (err) { /* 非対応環境では無視 */ }
            startAction(e);
        }

        function onPointerMove(e) {
            if (e.pointerId !== activePointerId) return;
            e.preventDefault();
            moveAction(e);
        }

        function onPointerUp(e) {
            if (e.pointerId !== activePointerId) return;
            try { svg.releasePointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
            activePointerId = null;
            endAction(e);
        }

        // 画面から離れたときに操作が固まらないようにする
        window.addEventListener('blur', () => {
            if (activePointerId === null) return;
            activePointerId = null;
            endAction({clientX: 0, clientY: 0});
        });

        function startAction(e) {
            let pt = getMousePos(e);
            let target = e.target;

            // 補助線をタップして消す（「消す」のときだけ。引いている最中に消えないように）
            const guideId = (target && target.getAttribute) ? target.getAttribute('data-guide-id') : null;
            if (guideId && currentTool === 'erase') {
                saveState();
                guides = guides.filter(g => g.id !== guideId);
                renderShapes();
                showToast('📏 補助線を1本消しました');
                return;
            }

            // Check if clicking on a shape
            if (target.tagName === 'polygon') {
                let shapeIndex = parseInt(target.getAttribute('data-index'), 10);
                let shape = shapes[shapeIndex];

                if (currentTool === 'move') {
                    preDragState = snapshot(); // 動いたときだけ履歴に積む
                    isDragging = true;
                    dragTarget = shape;
                    
                    // Bring to front
                    shapes.splice(shapeIndex, 1);
                    shapes.push(dragTarget);
                    renderShapes();

                    startPt = pt;
                    // 図形の元の頂点位置を記憶しておく
                    dragTarget.originalPoints = dragTarget.points.map(p => ({ x: p.x, y: p.y }));
                    // 切りこみもいっしょに動かす
                    dragTarget.originalCutPath = dragTarget.cutPath ? dragTarget.cutPath.map(p => ({x: p.x, y: p.y})) : null;
                    // マスの線に合わせる基準点（いちばん線に近い頂点）を決める
                    anchorX = findAnchor(dragTarget.originalPoints, 'x');
                    anchorY = findAnchor(dragTarget.originalPoints, 'y');
                } 
                else if (currentTool === 'rotate') {
                    saveState(); // 回転前に状態を保存
                    rotateShape(shape);
                    renderShapes();
                }
                else if (currentTool === 'flip') {
                    saveState(); // うら返す前に状態を保存
                    const edge = flipShapeOverEdge(shape, pt);
                    renderShapes();
                    showFlipAxis(edge);
                }
                else if (currentTool === 'color') {
                    saveState(); // 色変更前に状態を保存
                    // Change Color
                    let colorIdx = colors.findIndex(c => c.fill === shape.color.fill);
                    shape.color = colors[(colorIdx + 1) % colors.length];
                    renderShapes();
                }
                else if (currentTool === 'erase') {
                    saveState(); // 消す前に状態を保存
                    shapes.splice(shapeIndex, 1);
                    // 切っていない図形をそのまま消したときは、リセットでも戻さない
                    let placedIdx = placedShapes.findIndex(s => s.id === shape.id);
                    if (placedIdx !== -1) placedShapes.splice(placedIdx, 1);
                    renderShapes();
                    showToast('🧽 図形を1つ消しました');
                }
            }

            // Start cutting anywhere on canvas
            if (currentTool === 'cut' && !isDragging) {
                isCutting = true;
                // 切り始めの点もマス目の交点にスナップさせる
                cutStartPt = { x: snap(pt.x), y: snap(pt.y) };
                cutLine.setAttribute("x1", cutStartPt.x);
                cutLine.setAttribute("y1", cutStartPt.y);
                cutLine.setAttribute("x2", cutStartPt.x);
                cutLine.setAttribute("y2", cutStartPt.y);
                cutLine.style.display = "block";
            }

            // 補助線を引きはじめる
            if (currentTool === 'guide' && !isDragging) {
                isGuiding = true;
                guideStartPt = { x: snap(pt.x), y: snap(pt.y) };
                guidePreview.setAttribute("x1", guideStartPt.x);
                guidePreview.setAttribute("y1", guideStartPt.y);
                guidePreview.setAttribute("x2", guideStartPt.x);
                guidePreview.setAttribute("y2", guideStartPt.y);
                guidePreview.style.display = "block";
            }
        }

        function moveAction(e) {
            let pt = getMousePos(e);

            if (isDragging && dragTarget) {
                let rawDx = pt.x - startPt.x;
                let rawDy = pt.y - startPt.y;
                let result = computeSnap(rawDx, rawDy);

                dragTarget.points = dragTarget.originalPoints.map(p => ({
                    x: p.x + result.dx,
                    y: p.y + result.dy
                }));
                if (dragTarget.originalCutPath) {
                    dragTarget.cutPath = dragTarget.originalCutPath.map(p => ({
                        x: p.x + result.dx,
                        y: p.y + result.dy
                    }));
                }
                showSnapMarker(result.marker);
                renderShapes();
            }

            if (isCutting) {
                // ドラッグ中の切る線もマス目の交点にスナップさせる
                let snappedPt = { x: snap(pt.x), y: snap(pt.y) };
                cutLine.setAttribute("x2", snappedPt.x);
                cutLine.setAttribute("y2", snappedPt.y);
            }

            if (isGuiding) {
                let snappedPt = { x: snap(pt.x), y: snap(pt.y) };
                guidePreview.setAttribute("x2", snappedPt.x);
                guidePreview.setAttribute("y2", snappedPt.y);
            }
        }

        function endAction(e) {
            if (isDragging && dragTarget) {
                // すでにマス目に合わせた位置で確定させる
                let moved = dragTarget.points.some((p, i) =>
                    p.x !== dragTarget.originalPoints[i].x || p.y !== dragTarget.originalPoints[i].y
                );

                delete dragTarget.originalPoints; // 不要になった元の座標を削除
                delete dragTarget.originalCutPath;
                isDragging = false;
                dragTarget = null;
                showSnapMarker(null);

                if (moved && preDragState) pushHistory(preDragState);
                preDragState = null;
                renderShapes();
            }

            if (isCutting) {
                isCutting = false;
                cutLine.style.display = "none";
                let pt = getMousePos(e);
                let snappedPt = { x: snap(pt.x), y: snap(pt.y) };

                // Only cut if the line is long enough (prevents accidental clicks)
                let dist = Math.hypot(snappedPt.x - cutStartPt.x, snappedPt.y - cutStartPt.y);
                if (dist > 10) {
                    applyCutSegment(cutStartPt, snappedPt);
                }
            }

            if (isGuiding) {
                isGuiding = false;
                guidePreview.style.display = "none";
                let pt = getMousePos(e);
                let snappedPt = { x: snap(pt.x), y: snap(pt.y) };
                let dist = Math.hypot(snappedPt.x - guideStartPt.x, snappedPt.y - guideStartPt.y);
                if (dist > 10) {
                    saveState();
                    guides.push({
                        id: 'guide_' + guideIdCounter++,
                        x1: guideStartPt.x, y1: guideStartPt.y,
                        x2: snappedPt.x, y2: snappedPt.y
                    });
                    renderShapes();
                    showToast('📏 補助線を引きました');
                }
            }
        }

        // 平行移動だけでマスの交点にそろえられるなら、その動かす量を返す。
        // そろえられない向き（斜め）のときは動かしません。
        function gridFixOffset(pts) {
            const ax = findAnchor(pts, 'x');
            const ay = findAnchor(pts, 'y');
            const fx = snap(ax) - ax;
            const fy = snap(ay) - ay;
            const fits = pts.every(p =>
                Math.abs(snap(p.x + fx) - (p.x + fx)) < 0.01 &&
                Math.abs(snap(p.y + fy) - (p.y + fy)) < 0.01
            );
            return fits ? {dx: fx, dy: fy} : {dx: 0, dy: 0};
        }

        // 直線ABを折り目にして、点Pを反対がわへ折り返す
        function reflectPoint(p, a, b) {
            const vx = b.x - a.x, vy = b.y - a.y;
            const len2 = vx * vx + vy * vy;
            if (len2 < 0.0001) return {x: p.x, y: p.y};
            const t = ((p.x - a.x) * vx + (p.y - a.y) * vy) / len2;
            const fx = a.x + vx * t;   // 折り目に下ろした垂線の足
            const fy = a.y + vy * t;
            return {x: 2 * fx - p.x, y: 2 * fy - p.y};
        }

        // タップした場所にいちばん近い辺は何本目か
        function nearestEdgeIndex(shape, pt) {
            const n = shape.points.length;
            let best = 0, bestDist = Infinity;
            for (let i = 0; i < n; i++) {
                const q = closestPointOnSegment(pt, shape.points[i], shape.points[(i + 1) % n]);
                const d = Math.hypot(pt.x - q.x, pt.y - q.y);
                if (d < bestDist) { bestDist = d; best = i; }
            }
            return best;
        }

        // 選んだ辺を折り目にして、線対称にうら返す。
        // 折り目にした辺はその場に残るので、同じ辺の近くをもう一度タップすれば元に戻ります。
        function flipShapeOverEdge(shape, pt) {
            const n = shape.points.length;
            const i = nearestEdgeIndex(shape, pt);
            const a = {x: shape.points[i].x, y: shape.points[i].y};
            const b = {x: shape.points[(i + 1) % n].x, y: shape.points[(i + 1) % n].y};

            const pts = shape.points.map(p => reflectPoint(p, a, b));
            // 斜めの辺で折ると交点から外れます。まっすぐな辺や45度の辺のときは交点に戻します
            const fix = gridFixOffset(pts);

            shape.points = pts.map(p => ({x: p.x + fix.dx, y: p.y + fix.dy}));
            // 頂点をたどる向きが逆になるので、順番も入れかえる
            shape.points.reverse();
            // 切りこみもいっしょにうら返す
            if (shape.cutPath) {
                shape.cutPath = shape.cutPath.map(p => {
                    const q = reflectPoint(p, a, b);
                    return {x: q.x + fix.dx, y: q.y + fix.dy};
                });
            }
            return {a: a, b: b}; // 折り目（画面に少しのあいだ表示します）
        }

        // どの辺で折ったかが分かるように、折り目をしばらく光らせる
        let flipAxisTimer = null;
        function showFlipAxis(edge) {
            flipAxis.setAttribute('x1', edge.a.x);
            flipAxis.setAttribute('y1', edge.a.y);
            flipAxis.setAttribute('x2', edge.b.x);
            flipAxis.setAttribute('y2', edge.b.y);
            flipAxis.style.display = 'block';
            if (flipAxisTimer) clearTimeout(flipAxisTimer);
            flipAxisTimer = setTimeout(() => { flipAxis.style.display = 'none'; }, 900);
        }

        // 45度ずつ回す。
        // 45度の向きでは、頂点はマスの交点から外れます（1マス40px → 斜めは約28.28px）。
        // そのぶん、2回まわして90度の向きに戻ったときは必ず交点に戻すようにしてあります。
        // また、回したあとに外わくの中心を元の場所へ戻すので、何度まわしても図形が流れていきません。
        function rotateShape(shape) {
            const xs = shape.points.map(p => p.x);
            const ys = shape.points.map(p => p.y);
            const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
            const cy = (Math.min(...ys) + Math.max(...ys)) / 2;

            const cos = Math.SQRT1_2, sin = Math.SQRT1_2; // 45度
            const turn = p => ({
                x: cx + (p.x - cx) * cos - (p.y - cy) * sin,
                y: cy + (p.x - cx) * sin + (p.y - cy) * cos
            });

            const pts = shape.points.map(turn);

            // ①回したあとの外わくの中心を、回す前と同じ場所に戻す
            const rx = pts.map(p => p.x), ry = pts.map(p => p.y);
            let dx = cx - (Math.min(...rx) + Math.max(...rx)) / 2;
            let dy = cy - (Math.min(...ry) + Math.max(...ry)) / 2;

            // ②平行移動だけでマスの交点にそろえられる向き（＝90度ごとの向き）なら、交点に戻す
            const fix = gridFixOffset(pts.map(p => ({x: p.x + dx, y: p.y + dy})));
            dx += fix.dx;
            dy += fix.dy;

            shape.points = pts.map(p => ({x: p.x + dx, y: p.y + dy}));
            if (shape.cutPath) {
                shape.cutPath = shape.cutPath.map(p => {
                    const q = turn(p);
                    return {x: q.x + dx, y: q.y + dy};
                });
            }
        }

        // ===== 切る（とちゅうで止まる切りこみに対応） =====
        // 昔は「まっすぐ引いた線をどこまでも延長して切る」やり方でしたが、
        // それだと切った形が必ず端から端までになってしまいます。
        // いまは「実際にドラッグした線の分だけ」切ります。
        // 反対側まで届かなかった線は切りこみとして図形に残り、
        // その端から続きを切ると、L字などいろいろな形に分かれます。

        function copyPt(p) { return {x: p.x, y: p.y}; }
        function copyPath(path) { return path.map(copyPt); }
        function samePoint(a, b) { return Math.hypot(a.x - b.x, a.y - b.y) < CUT_EPS; }

        function polygonArea(pts) {
            let a = 0;
            for (let i = 0; i < pts.length; i++) {
                const j = (i + 1) % pts.length;
                a += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
            }
            return Math.abs(a) / 2;
        }

        // 点が多角形の内側かどうか（辺の真上かどうかは別に調べます）
        function pointInPolygon(p, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const xi = poly[i].x, yi = poly[i].y;
                const xj = poly[j].x, yj = poly[j].y;
                if (((yi > p.y) !== (yj > p.y)) && (p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            return inside;
        }

        // 多角形のふちのうち、その点にいちばん近い場所（何本目の辺の、どのあたりか）
        function nearestBoundary(p, poly) {
            const n = poly.length;
            let best = {edge: 0, t: 0, dist: Infinity, point: copyPt(poly[0])};
            for (let i = 0; i < n; i++) {
                const a = poly[i], b = poly[(i + 1) % n];
                const q = closestPointOnSegment(p, a, b);
                const d = Math.hypot(p.x - q.x, p.y - q.y);
                if (d < best.dist) {
                    const vx = b.x - a.x, vy = b.y - a.y;
                    const len2 = vx * vx + vy * vy;
                    let t = len2 < 0.0001 ? 0 : ((q.x - a.x) * vx + (q.y - a.y) * vy) / len2;
                    t = Math.max(0, Math.min(1, t));
                    best = {edge: i, t: t, dist: d, point: q};
                }
            }
            return best;
        }

        function isOnBoundary(p, poly) { return nearestBoundary(p, poly).dist < CUT_EPS; }
        function isInsideStrict(p, poly) { return !isOnBoundary(p, poly) && pointInPolygon(p, poly); }

        // 線分どうしの交点（どちらの線分の上にもある場合だけ返す）
        function segIntersect(a, b, c, d) {
            const rx = b.x - a.x, ry = b.y - a.y;
            const sx = d.x - c.x, sy = d.y - c.y;
            const den = rx * sy - ry * sx;
            if (Math.abs(den) < 1e-9) return null; // 平行
            const t = ((c.x - a.x) * sy - (c.y - a.y) * sx) / den;
            const u = ((c.x - a.x) * ry - (c.y - a.y) * rx) / den;
            if (t < -1e-9 || t > 1 + 1e-9 || u < -1e-9 || u > 1 + 1e-9) return null;
            return {t: t, u: u, point: {x: a.x + rx * t, y: a.y + ry * t}};
        }

        // 切り線が図形のふちにさわっている場所を、線の順番どおりに集める
        // pos は「線の何番目の区間の、どのあたりか」を表す数値
        function collectHits(path, poly) {
            const hits = [];
            const n = poly.length;

            // 線の折れ点がふちの上にある場合
            for (let k = 0; k < path.length; k++) {
                const nb = nearestBoundary(path[k], poly);
                if (nb.dist < CUT_EPS) {
                    hits.push({pos: k, point: copyPt(path[k]), edge: nb.edge, t: nb.t});
                }
            }
            // 線がふちを横切っている場合
            for (let k = 0; k < path.length - 1; k++) {
                for (let i = 0; i < n; i++) {
                    const r = segIntersect(path[k], path[k + 1], poly[i], poly[(i + 1) % n]);
                    if (!r) continue;
                    if (r.t < 1e-6 || r.t > 1 - 1e-6) continue; // 折れ点は上で処理済み
                    hits.push({pos: k + r.t, point: r.point, edge: i, t: r.u});
                }
            }

            hits.sort((a, b) => a.pos - b.pos);

            // 同じ場所が二重に入らないようにする
            const out = [];
            for (const h of hits) {
                const last = out[out.length - 1];
                if (last && samePoint(last.point, h.point)) continue;
                out.push(h);
            }
            return out;
        }

        // 2つのさわった場所のあいだの線を取り出す
        function subPath(path, F, L) {
            const out = [copyPt(F.point)];
            for (let k = Math.floor(F.pos) + 1; k <= Math.ceil(L.pos); k++) {
                if (k > F.pos + 1e-6 && k < L.pos - 1e-6 && path[k]) out.push(copyPt(path[k]));
            }
            out.push(copyPt(L.point));
            return out;
        }

        // その線が図形の内側だけを通っているか（辺の上をなぞっていないか）
        function pathInsideShape(path, poly) {
            if (!path || path.length < 2) return false;
            let len = 0;
            for (let i = 0; i < path.length - 1; i++) {
                const a = path[i], b = path[i + 1];
                len += Math.hypot(b.x - a.x, b.y - a.y);
                for (const t of [0.2, 0.5, 0.8]) {
                    const m = {x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t};
                    if (!isInsideStrict(m, poly)) return false;
                }
            }
            return len > CUT_EPS * 2;
        }

        // ふちの上をfromからtoまで進んだときに通る頂点を集める
        function walkVertices(poly, from, to) {
            const n = poly.length;
            const out = [];
            if (from.edge === to.edge && to.t >= from.t) return out; // 同じ辺のすぐ先なら頂点は通らない
            let i = (from.edge + 1) % n;
            for (let c = 0; c < n; c++) {
                out.push(copyPt(poly[i]));
                if (i === to.edge) break;
                i = (i + 1) % n;
            }
            return out;
        }

        // 図形を切り線で2つに分ける。分けられないときは null
        function tryCutShape(poly, path) {
            if (!path || path.length < 2 || poly.length < 3) return null;
            const hits = collectHits(path, poly);
            if (hits.length < 2) return null;

            const F = hits[0], L = hits[1]; // 最初に入った所と、最初に出た所
            const sub = subPath(path, F, L);
            if (!pathInsideShape(sub, poly)) return null;

            const piece1 = cleanPolygon(sub.concat(walkVertices(poly, L, F)));
            const piece2 = cleanPolygon(copyPath(sub).reverse().concat(walkVertices(poly, F, L)));

            if (piece1.length < 3 || piece2.length < 3) return null;
            if (polygonArea(piece1) < MIN_PIECE_AREA || polygonArea(piece2) < MIN_PIECE_AREA) return null;
            return [piece1, piece2];
        }

        // 切りこみとして残す部分だけを取り出す（図形の外にはみ出した分は捨てる）
        function trimCutPath(path, poly) {
            const hits = collectHits(path, poly);

            if (hits.length === 0) {
                return pathInsideShape(path, poly) ? copyPath(path) : null;
            }

            if (hits.length === 1) {
                const F = hits[0];
                const startInside = isInsideStrict(path[0], poly);
                let out;
                if (startInside) {
                    out = [];
                    for (let k = 0; k < path.length; k++) if (k < F.pos - 1e-6) out.push(copyPt(path[k]));
                    out.push(copyPt(F.point));
                } else {
                    out = [copyPt(F.point)];
                    for (let k = 0; k < path.length; k++) if (k > F.pos + 1e-6) out.push(copyPt(path[k]));
                }
                return pathInsideShape(out, poly) ? out : null;
            }

            const sub = subPath(path, hits[0], hits[hits.length - 1]);
            return pathInsideShape(sub, poly) ? sub : null;
        }

        // その線が図形にさわっているか
        function segmentTouchesShape(a, b, poly) {
            if (pointInPolygon(a, poly) || pointInPolygon(b, poly)) return true;
            if (isOnBoundary(a, poly) || isOnBoundary(b, poly)) return true;
            const n = poly.length;
            for (let i = 0; i < n; i++) {
                if (segIntersect(a, b, poly[i], poly[(i + 1) % n])) return true;
            }
            return false;
        }

        // すでにある切りこみと今ひいた線をつなぐ
        function combineCutPath(shape, a, b) {
            const cp = shape.cutPath;
            if (cp && cp.length >= 2) {
                const first = cp[0], last = cp[cp.length - 1];
                if (samePoint(a, last))  return {path: copyPath(cp).concat([copyPt(b)]), replaced: false};
                if (samePoint(b, last))  return {path: copyPath(cp).concat([copyPt(a)]), replaced: false};
                if (samePoint(a, first)) return {path: [copyPt(b)].concat(copyPath(cp)), replaced: false};
                if (samePoint(b, first)) return {path: [copyPt(a)].concat(copyPath(cp)), replaced: false};
            }
            if (!segmentTouchesShape(a, b, shape.points)) return null; // この図形には関係ない線
            return {path: [copyPt(a), copyPt(b)], replaced: !!(cp && cp.length >= 2)};
        }

        // ドラッグ1回分の切り線を、画面じゅうの図形にあてはめる
        function applyCutSegment(a, b) {
            const before = snapshot();
            const next = [];
            let cutCount = 0, pendingCount = 0, replacedCount = 0, changed = false;

            for (const shape of shapes) {
                const combined = combineCutPath(shape, a, b);
                if (!combined) { next.push(shape); continue; }

                const pieces = tryCutShape(shape.points, combined.path);
                if (pieces) {
                    cutCount++;
                    changed = true;
                    // 切ったあとの2つは同じ色にして、もとが1つだったことがわかるようにする
                    next.push({id: 'shape_' + shapeIdCounter++, points: pieces[0], color: shape.color});
                    next.push({id: 'shape_' + shapeIdCounter++, points: pieces[1], color: shape.color});
                    continue;
                }

                const trimmed = trimCutPath(combined.path, shape.points);
                if (trimmed) {
                    shape.cutPath = trimmed;
                    if (combined.replaced) replacedCount++;
                    pendingCount++;
                    changed = true;
                }
                next.push(shape);
            }

            if (!changed) {
                showToast('図形の上でスワイプしてね');
                return;
            }

            pushHistory(before);
            shapes = next;
            renderShapes();

            if (cutCount) showToast('✂️ ジョキッ！図形を切りました');
            else if (replacedCount) showToast('✂️ 新しい切りこみに引き直しました');
            else showToast('✂️ 切りこみを入れました。まるい印から続けて切ると分かれるよ');
        }

        // 同じ位置に重なった頂点を取り除く
        function cleanPolygon(poly) {
            let out = [];
            for (const p of poly) {
                const last = out[out.length - 1];
                if (last && Math.hypot(last.x - p.x, last.y - p.y) < CUT_EPS) continue;
                out.push(p);
            }
            const first = out[0];
            const last = out[out.length - 1];
            if (out.length > 1 && Math.hypot(first.x - last.x, first.y - last.y) < CUT_EPS) out.pop();
            return out;
        }

        // 背景をタップしたら設定パネルを閉じる
        document.getElementById('settings-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'settings-overlay') closeSettings();
        });
        document.getElementById('share-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'share-overlay') closeShare();
        });

        // パソコンのキーボード操作
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeSettings();
                closeShare();
                return;
            }
            if (!(e.ctrlKey || e.metaKey)) return;
            const k = e.key.toLowerCase();
            if (k === 'z') {
                e.preventDefault();
                if (e.shiftKey) redo(); else undo();
            } else if (k === 'y') {
                e.preventDefault();
                redo();
            }
        });

        // Setup Initial state
        loadShapeParams();
        if (applyLinkParams()) saveShapeParams(); // リンクの設定が優先
        renderMenu();
        updateView();                             // マスの大きさの表示を整える
        if (applyLinkScene()) renderShapes();     // リンクに図形や補助線が入っていれば並べる
        updateHistoryButtons();
        setTimeout(() => showToast('左のメニューから図形を追加してね！'), 500);

    </script>
</body>
</html>
