<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>図形の面積プロトタイプ</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap');
        html, body {
            height: 100vh;
            height: 100dvh; /* スマホのアドレスバー分を除いた実際の高さ */
        }
        body {
            font-family: 'Kosugi Maru', sans-serif;
            background-color: #f0fdf4;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;      /* 引っぱって再読み込みされるのを防ぐ */
            touch-action: none;             /* ドラッグ中に画面が動かないようにする */
            -webkit-user-select: none;
            user-select: none;              /* 長押しで文字が選択されるのを防ぐ */
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
        }
        button { -webkit-tap-highlight-color: transparent; }
        /* 横スクロールする列のスクロールバーを細く */
        .thin-scroll::-webkit-scrollbar { height: 4px; width: 4px; }
        .thin-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        /* リンクのURLだけは選択・コピーできるように */
        #share-url { -webkit-user-select: text; user-select: text; }
        /* 図形メニューのアイコン（狭い画面では少し小さく） */
        #shape-menu svg { width: 36px; height: 36px; }
        #shape-menu button { padding: 0.5rem; }
        @media (min-width: 640px) {
            #shape-menu svg { width: 40px; height: 40px; }
            #shape-menu button { padding: 0.75rem; }
        }
        /* 設定パネルのプレビュー（背の低い画面では小さく） */
        #settings-preview svg { height: 104px; }
        @media (min-height: 700px) { #settings-preview svg { height: 150px; } }
        .tool-btn.active {
            background-color: #3b82f6;
            color: white;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2);
            transform: scale(0.95);
        }
        .shape-polygon {
            transition: stroke-width 0.2s;
            cursor: pointer;
        }
        .shape-polygon:hover {
            stroke-width: 4;
        }
        #workspace {
            touch-action: none; /* Important for touch devices */
        }
        /* 補助線は「補助線」「消す」のときだけタップで拾えるようにする */
        #guides-layer { pointer-events: none; }
        #guides-layer.pickable { pointer-events: auto; }
        /* 切りこみ（とちゅうで止まっている切り線）はタップを邪魔しない */
        #cut-layer { pointer-events: none; }
        .is-disabled {
            opacity: 0.35;
            cursor: default;
        }
        #settings-overlay, #share-overlay {
            touch-action: auto;
        }
        .tab-btn.active {
            background-color: #22c55e;
            color: white;
            border-color: #16a34a;
        }
        .opt-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body class="w-screen flex flex-col sm:flex-row">

    <!-- Sidebar: Shape Selector -->
    <div class="bg-white w-full sm:w-40 lg:w-56 border-b sm:border-b-0 sm:border-r border-green-200 shadow-md flex flex-col z-10 flex-shrink-0">
        <div class="hidden sm:block py-3 bg-green-500 text-white font-bold text-lg text-center">
            📐 図形メニュー
        </div>
        <div id="shape-menu" class="thin-scroll p-2 sm:p-3 flex-1 flex flex-row sm:flex-col gap-2 overflow-x-auto sm:overflow-y-auto"></div>
        <div class="p-2 sm:p-3 border-t border-green-100 flex flex-col gap-2">
            <div class="flex gap-1 items-center">
                <button onclick="zoomStep(-1)" id="btn-zoom-out" class="w-10 h-9 rounded-xl font-bold text-lg leading-none bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700">－</button>
                <button onclick="resetZoom()" id="btn-zoom-label" class="flex-1 h-9 px-1 rounded-xl font-bold text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 whitespace-nowrap">🔍 100%</button>
                <button onclick="zoomStep(1)" id="btn-zoom-in" class="w-10 h-9 rounded-xl font-bold text-lg leading-none bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700">＋</button>
            </div>
            <div class="flex gap-2">
                <button onclick="openSettings()" class="flex-1 px-2 py-2 rounded-xl font-bold text-sm bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700">
                    ⚙️ 大きさ
                </button>
                <button onclick="openShare()" class="flex-1 px-2 py-2 rounded-xl font-bold text-sm bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700">
                    🔗 リンク
                </button>
            </div>
            <p class="hidden lg:block text-xs text-gray-500 text-center">マス目は1辺1cmのイメージです</p>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col relative min-h-0 min-w-0">
        <div class="thin-scroll bg-white border-b border-gray-200 px-2 py-2 sm:px-3 flex items-center gap-2 overflow-x-auto shadow-sm z-10">
                <button onclick="setTool('move')" id="btn-move" class="tool-btn active flex-shrink-0 px-4 py-2 rounded-full font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300">
                    👆 移動
                </button>
                <button onclick="setTool('cut')" id="btn-cut" class="tool-btn flex-shrink-0 px-4 py-2 rounded-full font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300">
                    ✂️ 切る
                </button>
                <button onclick="setTool('rotate')" id="btn-rotate" class="tool-btn flex-shrink-0 px-4 py-2 rounded-full font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300">
                    🔄 回す
                </button>
                <button onclick="setTool('flip')" id="btn-flip" class="tool-btn flex-shrink-0 px-4 py-2 rounded-full font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300">
                    🪞 うら返す
                </button>
                <button onclick="setTool('color')" id="btn-color" class="tool-btn flex-shrink-0 px-4 py-2 rounded-full font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300">
                    🎨 色ぬり
                </button>
                <button onclick="setTool('guide')" id="btn-guide" class="tool-btn flex-shrink-0 px-4 py-2 rounded-full font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300 whitespace-nowrap">
                    📏 補助線
                </button>
                <button onclick="setTool('erase')" id="btn-erase" class="tool-btn flex-shrink-0 px-4 py-2 rounded-full font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300">
                    🧽 消す
                </button>
                <div class="w-px h-7 bg-gray-300 flex-shrink-0 sm:ml-auto"></div>
                <button onclick="undo()" id="btn-undo" class="flex-shrink-0 is-disabled px-4 py-2 rounded-full font-bold bg-yellow-100 text-yellow-700 hover:bg-yellow-200 border border-yellow-300 whitespace-nowrap">
                    ↩️ もどる
                </button>
                <button onclick="redo()" id="btn-redo" class="flex-shrink-0 is-disabled px-4 py-2 rounded-full font-bold bg-sky-100 text-sky-700 hover:bg-sky-200 border border-sky-300 whitespace-nowrap">
                    ↪️ すすむ
                </button>
                <button onclick="resetToPlaced()" id="btn-reset" class="flex-shrink-0 px-4 py-2 rounded-full font-bold bg-orange-100 text-orange-600 hover:bg-orange-200 border border-orange-300 whitespace-nowrap">
                    ♻️ リセット
                </button>
                <button onclick="clearAll()" id="btn-clear" class="flex-shrink-0 px-4 py-2 rounded-full font-bold bg-red-100 text-red-600 hover:bg-red-200 border border-red-300 whitespace-nowrap">
                    🗑️ 全て消す
                </button>
        </div>

        <div class="flex-1 relative w-full bg-blue-50 overflow-hidden cursor-crosshair min-h-0">
            <svg id="workspace" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <!-- Grid Pattern -->
                <defs>
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
                    </pattern>
                </defs>

                <!-- ここから内側が拡大・縮小されます（図形の座標そのものは変わりません） -->
                <g id="view">
                    <rect id="grid-rect" x="0" y="0" width="100%" height="100%" fill="url(#grid)" />

                    <!-- Group for Shapes -->
                    <g id="shapes-layer"></g>

                    <!-- 補助線（じゃまにならないよう、使うツールのときだけタップできる） -->
                    <g id="guides-layer"></g>

                    <!-- とちゅうで止まっている切りこみ -->
                    <g id="cut-layer"></g>

                    <!-- Cutting Line (Dynamic) -->
                    <line id="cut-line" x1="0" y1="0" x2="0" y2="0" stroke="#ef4444" stroke-width="3" stroke-dasharray="5,5" vector-effect="non-scaling-stroke" style="display:none;" />

                    <!-- 補助線を引いているときの下書き -->
                    <line id="guide-preview" x1="0" y1="0" x2="0" y2="0" stroke="#475569" stroke-width="2.5" stroke-dasharray="8,6" stroke-linecap="round" vector-effect="non-scaling-stroke" style="display:none;" />

                    <!-- うら返したときの折り目（少しのあいだ表示） -->
                    <line id="flip-axis" x1="0" y1="0" x2="0" y2="0" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke" style="display:none;" />

                    <!-- Snap Indicator (Dynamic) -->
                    <circle id="snap-marker" r="9" fill="none" stroke="#16a34a" stroke-width="3" vector-effect="non-scaling-stroke" style="display:none;" />
                </g>
            </svg>
            
            <!-- Instructions Overlay -->
            <div id="instruction-toast" class="absolute bottom-3 left-1/2 transform -translate-x-1/2 max-w-[92%] bg-gray-800 text-white px-4 py-2 sm:px-6 sm:py-3 rounded-full opacity-80 pointer-events-none transition-opacity duration-300 text-xs sm:text-sm md:text-base text-center">
                図形を選んで追加してね！
            </div>
        </div>
    </div>
